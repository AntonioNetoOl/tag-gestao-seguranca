<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">TAG</span>
      <div>
        <strong>Gestão</strong>
        <small>Segurança</small>
      </div>
    </div>

    <nav class="menu" aria-label="Menu principal">
      @for (item of menu; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <section class="content-area">
    <header class="topbar">
      <div>
        <span class="eyebrow">Sistema TAG</span>
        <h1>Área administrativa</h1>
      </div>

      <div class="user-area">
        <div class="user-data">
          <strong>{{ usuario()?.nome || 'Usuário' }}</strong>
          <span>{{ usuario()?.perfil || 'Master' }}</span>
        </div>
        <button type="button" class="logout" (click)="sair()">Sair</button>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </section>
</div>
